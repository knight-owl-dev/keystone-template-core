# ------------------------------------------------------------------------------
# Keystone project configuration
#
# Operational settings — what this project is called and how it builds. The
# document itself (title, author, layout) is pandoc.yaml.
#
# ➤ Set KEYSTONE_PROJECT below; everything else has a working default.
#
# https://keystone.knight-owl.dev/configuration/project-conf/
# ------------------------------------------------------------------------------

# Names your output files (my-project-book-20260101.pdf). Short and lowercase,
# no spaces — the project's name, not the document's title. The build warns
# until you change it.
# https://keystone.knight-owl.dev/configuration/project-conf/#project-identity
KEYSTONE_PROJECT=keystone

# ------------------------------------------------------------------------------
# Docker
# https://keystone.knight-owl.dev/configuration/project-conf/#docker
# ------------------------------------------------------------------------------

# The Compose project namespace — prefixes the networks, containers and volumes
# a build creates.
KEYSTONE_DOCKER_COMPOSE_PROJECT=keystone-${KEYSTONE_PROJECT}

# The image `make image` builds and the build runs.
KEYSTONE_DOCKER_IMAGE=${KEYSTONE_DOCKER_COMPOSE_PROJECT}:local

# ------------------------------------------------------------------------------
# Builds
# ------------------------------------------------------------------------------

# true fails the build on any warning, writing no new file. `make publish
# strict=true` overrides it for one run.
# https://keystone.knight-owl.dev/publishing/#strict-builds-for-ci-and-release
KEYSTONE_WARNINGS_AS_ERRORS=false

# How much of a build to report: off | plain | auto | verbose. `make publish
# progress=<mode>` overrides it for one run.
# https://keystone.knight-owl.dev/publishing/#watching-a-build-run
KEYSTONE_PROGRESS=auto

# ------------------------------------------------------------------------------
# Build configurations — conditional inclusion
# https://keystone.knight-owl.dev/writing/conditional-content/
# ------------------------------------------------------------------------------
#
# A configuration is a named symbol set that gates parts of the manuscript.
# Declare as many as you need, then select one with `make publish using=<name>`;
# the name suffixes the output filename.
#
# KEYSTONE_DEFINE_private="personal annotations drafts"

# The configuration to build when `using=` is omitted. Empty builds the plain
# edition.
KEYSTONE_USING=

# ------------------------------------------------------------------------------
# Hooks — rendering handed to a program the compose file wires in
# https://keystone.knight-owl.dev/hooks/
# ------------------------------------------------------------------------------
#
# The timeout and the cache act only where a hook is wired; a template that ships
# one says so on its own page. KEEP_ALIVE below applies either way — it decides
# whether a finished build stops this project's containers.

# Keep hook containers running once a build finishes, so the next build does not
# start them again. False stops them whether the build succeeded or not — an idle
# hook still holds its resources. Accepts true/1/yes/on or false/0/no/off, any
# case; `make publish down=true` stops them for one build without changing this.
KEYSTONE_HOOKS_KEEP_ALIVE=true

# Seconds a hook has to answer one block.
KEYSTONE_HOOKS_TIMEOUT=30

# Where hook replies are remembered. Empty is a volume the engine owns, which
# `make reset` clears. A path inside artifacts/ lets you open what a hook
# produced; anywhere else needs a writable mount of its own.
KEYSTONE_HOOKS_CACHE=

# Megabytes the cache may hold before the least recently used replies drop.
KEYSTONE_HOOKS_CACHE_MAX=64
